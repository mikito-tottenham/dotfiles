# model_registry.yaml — role / tier → provider/model/config/実行モードの正本 (resolver)
#
# 正本: dotfiles repo `skills/agent-orchestrator/rules/model_registry.yaml`
# 配備先 (~/.claude/skills/... または ~/.codex/skills/...) は
# `gh skill install` の生成物。編集は必ず正本側で行い、再 install で反映する。
#
# 契約:
# - モデル名・effort・provider の正本はこのファイルだけが持つ。
#   SKILL.md や他 skill にモデル名をハードコードしない。
# - subprocess 機構 (prompt file / stream log / timeout / summary / failure) は
#   各 runner skill が所有する。このファイルは選択のみを所有する。
# - 判断基準はこのファイルに書き、tier / provider の選択は親オーケストレータが
#   タスク内容から毎回推論する(基準は文書、判断は動的)。
#
# 2026-07-25 ユーザー判断: Gemini / Grok / Copilot は route に使わない。
# 2026-10-23: Gemini / Copilot の runner skill は撤去済み(Grok の runner は
# X/Twitter 証拠取得など route 外の用途のため残置)。対応 tier / role が存在しない依頼は、
# 暗黙 fallback せず route 不在としてユーザーへ blocked 報告すること。
#
# v3: provider: parent と codex self_elision を追加し、resolver を親相対化。
# v4 (2026-09-15): Codex 列を `~/.codex/models_cache.json` に実在する ID だけで構成。
#   S/A = gpt-6-astra (config.toml 既定。effort は low/medium/high/xhigh/max/ultra)、
#   B = gpt-5.6-sol、C = gpt-5.6-luna。gpt-5.5 は registry から外した。
# v5 (2026-10-25): 既定の実行者を親に反転した (ADR-0077)。委譲は親 AI の正規指示
#   ファイル (AGENTS-common) の委譲条件に当たる作業に限り、解決 model が親と同じ
#   場合は model_elision に従う。committer role を削除した。

version: 5
updated_at: "2026-10-25"

execution_modes:
  self: >-
    親の直接実行。既定の実行モード。意図明確化・計画・委譲・artifact 検査・
    統合・裁定・最終報告に加え、委譲条件に当たらない具体タスクも親が行う。
    委譲条件の正本は親 AI の正規指示ファイル (AGENTS-common の委譲条項)。
  agent_tool: >-
    親 provider の subagent 機構 (Claude Code: Agent tool / Codex: custom agent)
    で同 provider の subagent へ委譲する (Self-Elision: 外部 CLI subprocess を
    起動しない)。委譲条件に当たる場合だけ使い、解決 model が親と同じ場合は
    model_elision に従う。
  cli_runner: >-
    provider 対応の runner skill で外部 CLI subprocess として実行する。

providers:
  codex:
    runner: codex-cli-runner
    mode: cli_runner
    self_elision: >-
      親が Codex のときは cli_runner を使わず agent_tool へ委譲する。
      親が Claude Code 等のときのみ codex-cli-runner を使う。
  claude_code:
    runner: claude-cli-runner
    mode: agent_tool
    self_elision: >-
      親が Claude Code のときは cli_runner を使わず agent_tool へ委譲する。
      親が Codex 等のときのみ claude-cli-runner を使う。

provider_resolution:
  parent: >-
    親自身の provider キー (claude_code / codex) に置換する。
    tiers の同名列で model / effort を解決し、mode は self_elision により
    常に agent_tool になる。解決 model が親と同じ場合は model_elision に従う。

model_elision: >-
  解決した model が親と同じ場合は、委譲条件のうち文脈の切り離し・並列化・
  ツールや指示の分離・独立レビューのどれかに当たるときだけ agent_tool で委譲する。
  役割分担だけが理由なら委譲せず、親が直接実行する (固定費とレイテンシが
  増えるだけで、コスト上の利点がないため)。

harness_notes:
  codex_custom_agents: >-
    Codex custom agent の model / model_reasoning_effort の解決順は
    「agent file の値 > 明示 spawn 値 > [agents] 既定 > 親値」
    (Codex manual https://developers.openai.com/codex/codex-manual.md、2026-07-28 取得)。
    不変条件: tier の正本はこの registry のため、~/.codex/agents/*.toml に
    model / model_reasoning_effort を pin しないこと (pin すると spawn override が
    無効化され tier が無言で無視される)。
    運用契約: Codex 親では spawn 時に model / effort を必ず明示すること。省略は
    親既定 (現状 medium) への暗黙 fallback であり、tier 未適用として扱う。
    full-history fork と model / effort override の併用不可は、実行環境の
    spawn_agent callable schema の観測 (2026-07-28、ハーネス版依存) であり
    manual 由来ではない。

# worker tier ladder — Claude と GPT を同一の賢さ軸に並べた実行層。
#
# この ladder は**統一軸(目安)**であり、機械的な規則ではない。
# 親オーケストレータはタスク内容と各モデルの特性
# (`references/model-profiles.md` を判断材料としていつでも参照してよい)から
# tier と provider 列を柔軟に推論する。目安から逸脱する選択をした場合は
# 理由を一言、artifact または報告に残す(監査可能性のため)。
#
# 目安(既定の倒し方):
# - `intent` に照らして選び、迷ったら 1 段下の tier(安い方)から始める。
# - blocked または品質不足のときは 1 段昇格して再委譲する(黙って親が代行しない)。
# - 同 tier 内の provider は codex に寄せる(クレジット余剰のため)。
#   Claude Code のハーネス(MCP・ブラウザ・セッション内ツール・親と同じ
#   ローカル権限)が必要な実行、日本語ニュアンス重視の執筆、クロスモデル
#   レビューなどは claude_code 列(詳細は model-profiles.md)。
# - 反復実行ループ(閾値・例外は AGENTS.md の反復スクリプト化ルール参照)は
#   スクリプト化を優先し、スクリプト生成・実行の委譲は C/B tier から始める。
# - 委譲条件に当たらない作業は委譲しない(委譲の固定費 > 実行コストのため)。
# - クロスモデルレビューが必要な場合は、role の provider を親と異なる列へ
#   明示して cli_runner で倒してよい (逸脱理由を artifact または報告に記録)。
tiers:
  S:
    intent: >-
      最難関。novel な設計判断、要件が曖昧で高リスク、失敗コストが大きい、
      複数の相反する制約の裁定が必要。
    codex: { model: gpt-6-astra, effort: xhigh }
    claude_code: { model: fable }  # トークン最高価のため使用は最小限に。親が fable なら model_elision に従う
  A:
    intent: >-
      実装主力。設計判断を含む実装、複数ファイルにまたがる変更、
      本格的な調査・執筆、Web 調査、GitHub 連携作業。
    codex: { model: gpt-6-astra, effort: high }
    claude_code: { model: opus }
  B:
    intent: >-
      定型実装。仕様が明確で範囲が限定された実装・修正・調査・執筆。
      手順は自明だが多少の判断を伴う作業。
    codex: { model: gpt-5.6-sol, effort: low }
    claude_code: { model: sonnet }
  C:
    intent: >-
      機械的軽作業。整形・変換・抽出・テンプレ適用・一括置換の実行。
      判断要素がほぼない作業。
    codex: { model: gpt-5.6-luna }  # effort 省略 = モデル既定
    claude_code: { model: haiku }

roles:
  orchestrator:
    mode: self
    use_for: >-
      既定の実行者。委譲条件に当たらない具体タスクの実行、タスク分解、
      委譲判断、tier/role 判断、artifact 検査、統合、裁定、最終報告
  worker:
    tier: dynamic  # 親が tiers の選択規則に従いタスクごとに推論する
    use_for: >-
      委譲条件に当たる実行系作業 (大量の読み込み、独立したワークパッケージの
      並列実行、別利用枠で行う大きめの実装・調査など)
  reviewer_tech:
    provider: parent
    mode: agent_tool
    subagent: tech
    tier: A  # 親 provider の列で解決。不可逆・高リスク案件は S へ昇格可
    use_for: 設計・実装方針・コード・アーキテクチャ・不可逆リスク・長期保守性のレビュー
  reviewer_biz:
    provider: parent
    mode: agent_tool
    subagent: biz
    tier: A  # 親 provider の列で解決。重要な事業判断は S へ昇格可
    use_for: 事業前提、顧客価値、収益性、運用設計、意思決定のトレードオフ整理
  secretary:
    provider: parent
    mode: agent_tool
    subagent: personal
    tier: B  # 親 provider の列で解決
    use_for: >-
      予定調整、タスク整理、連絡文案、実務段取り。
      secret・認証情報・raw の予定本文/連絡先を渡さない (AGENTS.md の personal 制約に準拠)。

# skill 固有の override。参照形式: skills.<skill>.roles.<role>
# ここに定義がない skill は上の roles / tiers を既定として使う。
skills: {}
